name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (register model)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Build and run the tests at 1024, 1000 and 100 Hz ticks
        run: |
          cmake -S . -B build-host -G Ninja -DDA7281_HOST_TESTS=ON
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

  cross-build:
    name: Cortex-M4F build (nRF52833)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the Arm GNU toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build
      - name: Compile the library and the example (API stand-ins in place of the nRF5 SDK)
        run: |
          cmake -S . -B build-arm -G Ninja -DBUILD_EXAMPLES=ON
          cmake --build build-arm
          arm-none-eabi-size build-arm/libda7281_hal.a

  static-analysis:
    name: Static analysis and formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck clang-format
      - name: cppcheck
        run: >
          cppcheck --enable=warning,style,performance,portability --std=c99 --inline-suppr
          --error-exitcode=1 --suppress=missingIncludeSystem -Iinclude -Itest/stubs --quiet
          src/ examples/ test/
      - name: clang-format (.clang-format)
        run: find src include examples test -name '*.c' -o -name '*.h' | xargs clang-format --dry-run --Werror

  documentation:
    name: Doxygen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Generate documentation
        run: doxygen Doxyfile
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-docs
          path: docs/html/
